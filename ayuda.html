<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayuda y asistencia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #000;
      color: #fff;
      min-height: 100vh;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Cabecera */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 24px;
      padding: 12px 0;
    }
 
    .header-title {
      font-size: 22px;
      font-weight: bold;
    }

    /* Icono de soporte */
    .support-icon-wrap {
      display: flex;
      justify-content: center;
      margin: 20px 0 28px;
    }
    .support-icon {
      width: 180px;
      height: 180px;
    }

    /* Textos centrales */
    .main-title {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 16px;
    }
    .main-desc {
      font-size: 16px;
      color: #999;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    /* Tarjetas de contacto */
    .contact-card {
      background-color: #121212;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #ff0000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .contact-content {
      flex: 1;
    }
    .contact-label {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .contact-value {
      font-size: 18px;
      color: #999;
    }
    .arrow-icon {
      width: 24px;
      height: 24px;
      color: #666;
      flex-shrink: 0;
    }
    .back-icon { 
      width: 28px; 
      height: 28px; 
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    /* === SOLO MODIFICADO ESTE BOTÓN === */
    .btn-terminos {
      background-color: #ffffff00;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 10px 24px;       /* Más pequeño */
      font-size: 0.95rem;       /* Texto más pequeño */
      border-radius: 50px;
      cursor: pointer;
      width: auto;              /* Ya no ocupa todo el ancho */
      max-width: 300px;         /* Más angosto */
      box-sizing: border-box;
      display: block;
      margin: 28px auto 0;      /* Más separado arriba + centrado */
      text-align: center;
    }

    .espacios_blancos{
      color: #000;
    }
    /* === FIN DE MODIFICACIÓN === */
  </style>
</head>
<body>


    <header class="header">
    <a href="/menu.html"><img src="/img/interfaz/icons/atras.webp" alt="Atrás" class="back-icon"></a>
    <h1 class="header-title">Ayuda y asistencia</h1>

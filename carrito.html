<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Carrito</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; color:#fff; }
    body { background-color:#000; max-width:950px; margin:0 auto; padding:16px; min-height:100vh; padding-bottom:100px; }

    .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    .header-icon { width:26px; height:26px; cursor:pointer; }
    .page-title { font-size:19px; font-weight:bold; }

    .vaciar-contenedor { display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
    .texto-vaciar { font-size:11px; color:#777; }

    .cart-item { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid #222; }
    .item-img { width:55px; height:75px; object-fit:contain; }
    .item-info { flex:1; }
    .item-name { font-size:15px; font-weight:bold; margin-bottom:3px; }
    .item-desc { font-size:12px; color:#aaa; margin-bottom:4px; }
    .item-price { font-size:15px; font-weight:bold; }

    .item-actions { display:flex; align-items:center; gap:8px; }
    .qty-control { display:flex; align-items:center; border:1px solid #444; border-radius:6px; overflow:hidden; }
    .qty-btn { background-color:#222; border:none; color:#fff; width:28px; height:30px; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .qty-val { width:30px; text-align:center; font-size:14px; }
    .delete-btn { background:none; border:none; color:red; font-size:18px; cursor:pointer; padding:0 4px; }

    .totals { margin-top:20px; padding:0 4px; }
    .total-row { display:flex; justify-content:space-between; padding:6px 0; font-size:15px; }
    .total-row.final { font-size:18px; font-weight:bold; padding-top:10px; margin-top:6px; border-top:1px solid #222; }

    .btn-finalizar { width:100%; background-color:red; color:#fff; border:none; padding:14px; border-radius:24px; font-size:16px; font-weight:bold; margin-top:24px; cursor:pointer; transition:opacity 0.2s; }
    .btn-finalizar:disabled { background-color:#444; cursor:not-allowed; opacity:0.6; }

    .empty-msg { text-align:center; color:#777; padding:40px 0; }

    .modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-contenido {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .modal-titulo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .modal-texto {
      font-size: 16px;
      color: #ddd;
      margin-bottom: 28px;
      line-height: 1.4;
    }
    .modal-btn-si {
      width: 100%;
      background-color: red;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .modal-btn-no {
      background: transparent;
      border: none;
      color: red;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="menu.html"><img src="/img/interfaz/icons/atras.webp" alt="Atrás" class="header-icon"></a>
    <h1 class="page-title">Mi carrito</h1>
    <div class="vaciar-contenedor" onclick="clearCart()">
      <img src="/img/interfaz/icons/vaciar.webp" alt="Vaciar" class="header-icon">
      <span class="texto-vaciar">Vaciar</span>
    </div>
  </header>

  <div id="cartList"></div>

  <div class="totals">
    <div class="total-row"><span>Subtotal</span><span id="subtotal">Q0.00</span></div>
    <div class="total-row"><span>Envío</span><span id="shipping">Q0.00</span></div>
    <div class="total-row final"><span>Total</span><span id="total">Q0.00</span></div>
  </div>

  <button id="btnFinalizar" class="btn-finalizar" onclick="irAFinalizar()">Finalizar compra</button>

  <div id="modalVaciar" class="modal-fondo">
    <div class="modal-contenido">
      <h2 class="modal-titulo">¿Vaciar carrito?</h2>
      <p class="modal-texto">Se eliminarán todos los productos de tu carrito de compras.</p>
      <button class="modal-btn-si" onclick="confirmarVaciar()">Sí, vaciar carrito</button>
      <button class="modal-btn-no" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

<script>
function calcularEnvio(subtotal) {
  if(subtotal >= 100) return { monto: 0, etiqueta: 'Gratis' };
  if(subtotal >= 50) return { monto: 10, etiqueta: 'Q10.00' };
  return { monto: 15, etiqueta: 'Q15.00' };
}

function renderCart() {
  const cart = JSON.parse(localStorage.getItem('carrito') || '[]');
  const list = document.getElementById('cartList');
  const btnFinalizar = document.getElementById('btnFinalizar');
  list.innerHTML = '';

  if(cart.length === 0) {
    list.innerHTML = '<p class="empty-msg">Tu carrito está vacío</p>';
    document.getElementById('subtotal').textContent = 'Q0.00';
    document.getElementById('shipping').textContent = 'Q0.00';
    document.getElementById('total').textContent = 'Q0.00';
    btnFinalizar.disabled = true;
    return;
  }

  btnFinalizar.disabled = false;

  let subtotalSum = 0;
  cart.forEach((p, index) => {
    const precio = Number(p.precio) || 0;
    const cantidad = Number(p.cantidad) || 1;
    const imgUrl = p.imagen || p.rutaImagen || '';
    const desc = p.descripcion || '';

    subtotalSum += precio * cantidad;

    const item = document.createElement('div');
    item.className = 'cart-item';
    item.innerHTML = `
      <img src="${imgUrl}" class="item-img" alt="${p.nombre}" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 55 75%22%3E%3Crect fill=%22%23222%22 width=%2255%22 height=%2275%22/%3E%3C/svg%3E';">
      <div class="item-info">
        <h4 class="item-name">${p.nombre}</h4>
        ${desc ? `<p class="item-desc">${desc}</p>` : ''}
        <p class="item-price">Q${precio.toFixed(2)}</p>
      </div>
      <div class="item-actions">
        <div class="qty-control">
          <button class="qty-btn" onclick="changeCartQty(${index}, -1)">−</button>
          <span class="qty-val">${cantidad}</span>
          <button class="qty-btn" onclick="changeCartQty(${index}, 1)">+</button>
        </div>
        <button class="delete-btn" onclick="removeItem(${index})">🗑</button>
      </div>
    `;
    list.appendChild(item);
  });

  const envio = calcularEnvio(subtotalSum);
  const total = subtotalSum + envio.monto;

  document.getElementById('subtotal').textContent = `Q${subtotalSum.toFixed(2)}`;
  document.getElementById('shipping').textContent = envio.monto === 0 ? 'Gratis' : `Q${envio.monto.toFixed(2)}`;
  document.getElementById('total').textContent = `Q${total.toFixed(2)}`;
}

function irAFinalizar() {
  const cart = JSON.parse(localStorage.getItem('carrito') || '[]');
  if(cart.length === 0) {
    alert('Tu carrito está vacío. Agrega productos antes de continuar.');
    return;
  }
  window.location.href = 'finalizar-compra.html';
}

function changeCartQty(index, delta) {
  const cart = JSON.parse(localStorage.getItem('carrito') || '[]');
  if (!cart[index]) return;

  cart[index].cantidad = (Number(cart[index].cantidad) || 1) + delta;

  if (cart[index].cantidad <= 0) {
    cart.splice(index, 1);
  }

  localStorage.setItem('carrito', JSON.stringify(cart));
  renderCart();
}

function removeItem(index) {
  const cart = JSON.parse(localStorage.getItem('carrito') || '[]');
  cart.splice(index, 1);
  localStorage.setItem('carrito', JSON.stringify(cart));
  renderCart();
}

function clearCart() {
  const cart = JSON.parse(localStorage.getItem('carrito') || '[]');
  if(cart.length === 0) return;
  document.getElementById('modalVaciar').style.display = 'flex';
}

function cerrarModal() {
  document.getElementById('modalVaciar').style.display = 'none';
}

function confirmarVaciar() {
  localStorage.setItem('carrito', '[]');
  renderCart();
  cerrarModal();
}

document.addEventListener("DOMContentLoaded", renderCart);
</script>
</body>
</html>
